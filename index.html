<style>
  /* ============================================================

  :root {

  .quit span { position: relative; }

  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }

  /* ---------- 先生用：設定 ---------- */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(17, 24, 39, .55); display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; -webkit-user-select: text; user-select: text; }
  .modal.open { display: flex; }
  .panel { width: min(100%, 900px); background: #fff; border-radius: 24px; padding: 22px clamp(14px, 4vw, 32px) 28px; font-weight: 400; font-size: 17px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }

  .panel h4 { margin: 14px 0 4px; }
  .note { color: var(--sub); font-size: 15px; line-height: 1.6; margin: 6px 0; }
  .panel label.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 0; border-bottom: 1px solid #F1F3F5; }

  .panel input[type=text], .panel select, .panel textarea { font: inherit; font-size: 17px; padding: 9px 12px; border: 2px solid #CED4DA; border-radius: 12px; background: #fff; }
  .panel textarea { width: 100%; min-height: 110px; line-height: 1.6; }

  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 12px; padding: 11px 18px; font-size: 16px; font-weight: 700; background: #E9ECEF; color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--blue); color: #fff; } .btn.ok { background: var(--go); color: #fff; } .btn.warn { background: #FFF0F0; color: #C92A2A; }

  .seg button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .srow { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #F1F3F5; }
  @media (max-width: 600px) { .srow { grid-template-columns: 1fr; } }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgba(17,24,39,.9); color: #fff; padding: 14px 22px; border-radius: 14px; font-size: 18px; z-index: 60; display: none; max-width: 90vw; text-align: center; }
  .toast.show { display: block; }
  .lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }

  .lib button .emo { font-size: 38px; }
  .lib h4 { grid-column: 1 / -1; margin: 6px 0 0; color: var(--sub); }

  /* ---------- プリント（A4） ---------- */
  #printRoot { display: none; }
  .ppage { flex: none; width: 210mm; height: 297mm; padding: 12mm 13mm 10mm; box-sizing: border-box; background: #fff; color: #111; position: relative; overflow: hidden; font-family: "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; font-weight: 700; display: flex; flex-direction: column; gap: 3mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .ppage .pe { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-weight: 400; }
  @media print {

    html, body { height: auto !important; overflow: visible !important; display: block !important; background: #fff !important; padding: 0 !important; }
    body > *:not(#printRoot) { display: none !important; }
    #printRoot { display: block !important; }
    #printRoot .ppage { page-break-after: always; break-after: page; }

  /* ---------- 🖨️ プリントの 画面 ---------- */
  .panel.wide { width: min(100%, 1180px); }
  .seglabel { margin: 12px 0 6px; font-weight: 700; font-size: 15px; }
  .prgrid { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 18px; margin-top: 10px; }

  .btn.blue { background: #1C7ED6; color: #fff; }

  /* ============================================================
     よみ サポーター
     ============================================================ */
  :root { --bg: #FAF8F2; --line: #E6E0D0; --accent: #3B5BDB; }
  .brand { color: #9C8F6E; }
  .tlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; width: min(1100px, 100%); }

  /* よむ がめん */
  .rd { gap: 6px; }
  .page { flex: 1; min-height: 0; overflow: auto; border-radius: 26px; padding: clamp(14px, 3vw, 40px); background: var(--pbg, #fff); color: var(--pfg, #212529); border: 4px solid var(--line); position: relative; -webkit-user-select: none; user-select: none; }

  .wk .ck { margin-right: .45em; }
  .page.vert .wk .ck { margin-right: 0; margin-bottom: .45em; }

  .focus .ck { opacity: .16; }
  .focus .ck.ln { opacity: 1; }
  .ruler { position: absolute; left: 0; right: 0; background: var(--hl, #FFE066); opacity: .22; pointer-events: none; border-radius: 10px; transition: top .15s, height .15s, left .15s, width .15s; }
  rt { font-size: .45em; letter-spacing: 0; color: var(--rt, #5C7CFA); }

  .bar button.play.on { background: #FA5252; border-color: #FA5252; box-shadow: 0 5px 0 #C92A2A; }
  .bar button small { font-size: 12px; display: block; line-height: 1; }
  .opt { position: fixed; right: 12px; bottom: 90px; z-index: 30; background: #fff; border: 4px solid var(--line); border-radius: 22px; padding: 12px; width: min(420px, calc(100vw - 24px)); max-height: 70vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 8px; }

  .tip { font-size: 14px; color: var(--sub); line-height: 1.6; background: #fff; border-radius: 14px; padding: 8px 12px; border: 2px dashed var(--line); }

  @media (max-width: 600px), (max-height: 520px) {
    .bar { gap: 5px; } .bar button { min-width: 46px; height: 48px; font-size: 19px; border-radius: 14px; padding: 0 6px; } .bar button.play { min-width: 70px; }

  /* プリント */

    // じっさいに ならべて、はいりきらない ところで つぎの ページへ
    const host = h('div', { style: 'position:absolute;left:-9999px;top:0;visibility:hidden' }); document.body.append(host);
    const mk = () => { host.innerHTML = '<div class="ppage">' + HD(title) + '<div class="pt' + (vert ? ' vert' : '') + '"><div class="txt' + (wk ? ' wk' : '') + '" style="font-size:' + fs + 'mm;font-family:' + FONTS.kyo[0].replace(/"/g, "'") + '"></div></div>' + PF + '</div>'; return host.querySelector('.txt'); };
    const pages = []; let box = mk(), p = null;
    const full = () => { const pt = host.querySelector('.pt'); return vert ? pt.scrollWidth > pt.clientWidth + 1 : pt.scrollHeight > pt.clientHeight + 1; };
    const flush = () => { pages.push(host.innerHTML); box = mk(); p = null; };
    paras.forEach(pa => {
      p = h('p'); box.append(p);
      pa.forEach(c => {
        const sp = h('span', { class: 'ck', html: chunkHTML(c, ruby) }); p.append(sp);
        if (full()) { sp.remove(); if (!p.childNodes.length) p.remove(); flush(); p = h('p'); box.append(p); p.append(sp); }
      });
    });
    pages.push(host.innerHTML); host.remove();
    return pages;
  }
  window.MieelPrintAPI = {
    version: 1, fixed: true,
    app: { id: 'yomi-supporter', title: 'よみ サポーター', icon: '📏' },
    list() {
      const ts = allTexts().map(t => [t.id, titleOf(t)]);
      return [{ id: 'text', name: 'よみやすい プリント', icon: '📄', params: [{ key: 't', label: 'ぶんしょう', opts: ts, def: (RD && textById(RD.id) ? RD.id : ts[0][0]) }, { key: 'fs', label: 'もじ', opts: [[6, 'ちゅう'], [8, 'だい'], [11, 'とくだい']], def: 8 }, { key: 'wk', label: 'わかちがき', opts: [['on', 'あける'], ['off', 'あけない']], def: 'on' }, { key: 'ruby', label: 'ふりがな', opts: [['on', 'つける'], ['off', 'つけない']], def: 'on' }, { key: 'vert', label: 'かきかた', opts: [['off', 'よこがき'], ['on', 'たてがき']], def: 'off' }] }];
    },
    build(id, params) { return Promise.resolve({ pages: buildPages(id, params), css: document.querySelector('style').textContent }); }
  };

  /* ============================================================
     先生用せってい
     ============================================================ */
  APP.renderSettings = function (add, st, vp, pidSel) {
    add(h('h3', null, '📏 みかたの せってい'), pidSel(),
      h('p', { class: 'note' }, vp.name + '：もじ ' + vp.v.fs + 'px・' + (THEMES[vp.v.theme] || THEMES.white)[3] + '・' + FONTS[vp.v.font][1] + '・' + (vp.v.wk ? 'わかちがき' : '') + (vp.v.ruby ? '・ふりがな' : '') + (vp.v.vert ? '・たてがき' : '') + '（よむ がめんの Aa で かえると、子どもごとに おぼえます）'),
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn', onclick: () => { vp.v = Object.assign({}, VDEF); persist(); refreshSettings(); } }, 'はじめの せっていに もどす')));
    const keys = Object.keys(store.dict);
    add(h('h3', null, 'あ おぼえた ふりがな（' + keys.length + '）'),
      keys.length ? h('div', { style: 'display:flex;flex-wrap:wrap;gap:6px' }, keys.map(k => h('span', { class: 'mini-btn', style: 'cursor:default' }, k + '（' + store.dict[k] + '）', h('button', { type: 'button', style: 'border:none;background:none;margin-left:4px', onclick: () => { delete store.dict[k]; persist(); refreshSettings(); } }, '✕')))) : h('p', { class: 'note' }, 'まだ ありません。'),
      SEG ? null : h('p', { class: 'note' }, '⚠ この ブラウザは じどうで くぎる きのうが ありません。スペースで くぎって いれて ください。'));
  };
  if (TEST) window.__ys = { store: () => store, build, openRead, RD: () => RD, persist };
  startApp();

})();
</script>
